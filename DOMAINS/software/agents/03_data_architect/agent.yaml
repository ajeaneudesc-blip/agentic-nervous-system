id: 03_data_architect
name: Data Architect
purpose: concevoir schéma, migrations, sécurité des données et contrats
requires_human: false
tier: specialist
requires_human_for:
- level_3
- level_4
inputs:
- spec
- data_requirements
outputs:
- schema
- migrations
- data_contracts
skills:
- 03_data_architect_skill
tools:
- read_context
- write_project_files
inspiration:
  repo: https://github.com/geekan/MetaGPT
  pattern: >
    rôle "Architect" qui produit schémas et diagrammes système structurés à
    partir d'un PRD ; repris comme gabarit de sortie (schéma + migrations +
    contrats de données formalisés), pas comme dépendance logicielle
    (aucun clone, exécution 100% Claude Code, cf. CLAUDE.md racine).
