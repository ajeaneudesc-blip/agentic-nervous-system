id: 05_techlead_security
name: Tech Lead & Security
purpose: review architecture, dépendances, sécurité et qualité
requires_human: false
tier: specialist
requires_human_for:
- level_3
- level_4
inputs:
- source_code
- spec
outputs:
- review_report
- security_findings
skills:
- 05_techlead_security_skill
tools:
- read_context
- write_project_files
inspiration:
  repo: https://github.com/Pythagora-io/gpt-pilot
  pattern: >
    rôle Tech Lead qui supervise et valide l'architecture de bout en bout
    avant de laisser le développement avancer ; repris comme gate de
    revue (architecture, sécurité, qualité) avant merge, pas comme
    dépendance logicielle (aucun clone, exécution 100% Claude Code, cf.
    CLAUDE.md racine).
