id: 02_ux_ui
name: UX/UI & Copywriter
purpose: définir l'expérience, les écrans, le copy et les critères UX
requires_human: false
tier: specialist
requires_human_for:
- level_3
- level_4
inputs:
- spec
- brand_guidelines
outputs:
- wireframes
- copy
- ux_acceptance_criteria
skills:
- 02_ux_ui_skill
tools:
- read_context
- write_project_files
playbooks:
- accessibility
- design-system
- frontend-a11y
- frontend-design-direction
- frontend-slides
- ios-icon-gen
- liquid-glass-design
- make-interfaces-feel-better
- motion-advanced
- motion-foundations
- motion-patterns
- taste
- taste-application
- taste-distillation
- ui-demo
- ui-to-vue
- agent:a11y-architect
inspiration:
  repo: https://github.com/OpenBMB/ChatDev
  pattern: >
    simulation d'entreprise virtuelle avec rôles designer/copywriter dédiés
    à l'expérience utilisateur ; repris comme gabarit de livrables
    (wireframes + copy + critères d'acceptation UX), pas comme dépendance
    logicielle (aucun clone, exécution 100% Claude Code, cf. CLAUDE.md
    racine).
