id: 01_product_owner
name: Product Owner / Orchestrator
purpose: transformer l'objectif utilisateur en spec exécutable et coordonner le run
requires_human: false
tier: primary
requires_human_for:
- level_3
- level_4
inputs:
- objective
- project_brief
- budget_limit_usd
outputs:
- spec
- task_breakdown
- approval_requests
skills:
- 01_product_owner_skill
tools:
- read_context
- write_project_files
- write_spec
- request_approval
playbooks:
- blueprint
- context-budget
- delivery-gate
- dev-team
- jira-integration
- living-docs-governance
- orch-add-feature
- orch-build-mvp
- orch-change-feature
- orch-fix-defect
- orch-pipeline
- orch-refine-code
- plan-canvas
- plan-orchestrate
- product-capability
- product-lens
- team-builder
- token-budget-advisor
- agent:chief-of-staff
- agent:doc-updater
- agent:planner
- agent:spec-miner
inspiration:
  repo: https://github.com/geekan/MetaGPT
  pattern: >
    rôle "Product Manager" qui transforme un objectif en PRD structuré puis
    orchestre les rôles suivants ; repris comme gabarit spec -> task
    breakdown -> approbations, pas comme dépendance logicielle (aucun clone,
    exécution 100% Claude Code, cf. CLAUDE.md racine).
